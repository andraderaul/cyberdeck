<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GLITCH//Studio — break a picture on purpose</title>
    <meta
      name="description"
      content="Break a picture on purpose. Start from a preset, then edit the chain of eight effects over an image or your live webcam. Export a PNG or record the feed."
    />

    <!--
      The program's own mark, in the sizes a tab, an iOS home screen and an install prompt each ask
      for. Cut from `public/favicon.svg` by `scripts/social-assets.mjs`; the 192/512/maskable set is
      the PWA icon set `manifest.webmanifest` points at.
    -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!--
      What makes the program installable (ADR 0027). Hand-written beside the icons rather than
      generated, for the reason the mark itself is: it is a short file that says what the deck is
      called on a home screen, and it should be reviewable as one. The deck-kit roster guard pins
      its `theme_color` to the same token the meta below carries.
    -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="GLITCH//Studio" />

    <!--
      `ice`'s --bg, which is what the script below paints on a first visit. A stored Theme moves the
      page but not the browser chrome; every Theme on the deck is a near-black, so the two never
      disagree by more than a shade (ADR 0024).
    -->
    <meta name="theme-color" content="#0a0a0f" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="CYBERDECK" />
    <meta property="og:title" content="GLITCH//Studio — break a picture on purpose" />
    <meta
      property="og:description"
      content="Start from a preset, then edit the chain: displacement, pixel sort, wave, channel shift, halftone, scanlines and more, over an image or your live webcam. Export a PNG or record the feed."
    />
    <meta property="og:url" content="https://cyberdeck-glitch-studio.vercel.app/" />
    <meta property="og:image" content="https://cyberdeck-glitch-studio.vercel.app/og-card.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="GLITCH//STUDIO: the wordmark torn into displaced bands and split across colour channels, under scanlines."
    />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="GLITCH//Studio — break a picture on purpose" />
    <meta
      name="twitter:description"
      content="Start from a preset, then edit the chain: displacement, pixel sort, wave, channel shift, halftone, scanlines and more, over an image or your live webcam. Export a PNG or record the feed."
    />
    <meta name="twitter:image" content="https://cyberdeck-glitch-studio.vercel.app/og-card.png" />
    <meta
      name="twitter:image:alt"
      content="GLITCH//STUDIO: the wordmark torn into displaced bands and split across colour channels, under scanlines."
    />
    <!--
      The Theme, before first paint (ADR 0024). Applying it from the module entry point is cleaner
      and wrong: that script is deferred, so the default palette paints for a frame first. It is
      hand-inlined here because the deck has no shared HTML; the rule it encodes lives as a pure
      function in the deck kit (`resolveTheme`), and the kit's roster guard holds the two together.
    -->
    <script>
      (() => {
        const THEMES = ['ice', 'construct', 'chiba', 'kuang', 'ougou', 'solitude', 'onyx']
        let stored = null
        try {
          stored = localStorage.getItem('cyberdeck:theme')
        } catch {
          // Safari private mode / a sandboxed iframe — the default is a fine answer.
        }
        document.documentElement.setAttribute('data-theme', THEMES.includes(stored) ? stored : 'ice')
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
