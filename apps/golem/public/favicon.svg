<!--
  GOLEM//Console's mark: the Console prompt — a chevron and a cursor. The Console is the program's
  only control grammar (ADR 0018), so the thing you type into is the thing on the tab.

  Phosphor rather than accent: the cyan is the machine's own voice in `ice`, and the prompt is where
  it answers you.

  Fixed hexes rather than tokens: an SVG served from `public/` has no stylesheet and no Theme
  (ADR 0024). These are `ice`'s --void and --color-phosphor, pinned.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="GOLEM//Console">
  <rect width="32" height="32" rx="2" fill="#0a0a0f" />
  <path
    d="M6 8 L14 16 L6 24"
    fill="none"
    stroke="#00e5ff"
    stroke-width="3.5"
    stroke-linecap="square"
    stroke-linejoin="miter"
  />
  <rect x="17" y="21" width="10" height="3.5" fill="#00e5ff" />
</svg>
