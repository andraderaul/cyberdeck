<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ASCII//Convert — image → ascii art</title>
    <meta
      name="description"
      content="Turn an image or your webcam into ASCII art, live in the browser. Charsets, edge glyphs, colour modes; export a PNG, plain text or selectable HTML."
    />

    <!--
      The program's own mark, in the sizes a tab, an iOS home screen and an install prompt each ask
      for. Cut from `public/favicon.svg` by `scripts/social-assets.mjs`; the 192/512/maskable set is
      a complete PWA icon set, which is what #324's manifest will point at.
    -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!--
      `ice`'s --bg, which is what the script below paints on a first visit. A stored Theme moves the
      page but not the browser chrome; every Theme on the deck is a near-black, so the two never
      disagree by more than a shade (ADR 0024).
    -->
    <meta name="theme-color" content="#0a0a0f" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="CYBERDECK" />
    <meta property="og:title" content="ASCII//Convert — image → ascii art" />
    <meta
      property="og:description"
      content="Turn an image or your webcam into ASCII art, live in the browser. Export a PNG, the plain text, or selectable coloured HTML. Nothing is uploaded — it all runs on your machine."
    />
    <meta property="og:url" content="https://ascii-art-converter-tawny.vercel.app/" />
    <meta
      property="og:image"
      content="https://ascii-art-converter-tawny.vercel.app/og-card.png"
    />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="ASCII//CONVERT: a lit sphere drawn entirely in ASCII characters, on a near-black field."
    />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="ASCII//Convert — image → ascii art" />
    <meta
      name="twitter:description"
      content="Turn an image or your webcam into ASCII art, live in the browser. Export a PNG, the plain text, or selectable coloured HTML. Nothing is uploaded — it all runs on your machine."
    />
    <meta
      name="twitter:image"
      content="https://ascii-art-converter-tawny.vercel.app/og-card.png"
    />
    <meta
      name="twitter:image:alt"
      content="ASCII//CONVERT: a lit sphere drawn entirely in ASCII characters, on a near-black field."
    />
    <!--
      The Theme, before first paint (ADR 0024). Applying it from the module entry point is cleaner
      and wrong: that script is deferred, so the default palette paints for a frame first. It is
      hand-inlined here because the deck has no shared HTML; the rule it encodes lives as a pure
      function in the deck kit (`resolveTheme`), and the kit's roster guard holds the two together.
    -->
    <script>
      (() => {
        const THEMES = ['ice', 'construct', 'chiba', 'kuang', 'ougou', 'solitude', 'onyx']
        let stored = null
        try {
          stored = localStorage.getItem('cyberdeck:theme')
        } catch {
          // Safari private mode / a sandboxed iframe — the default is a fine answer.
        }
        document.documentElement.setAttribute('data-theme', THEMES.includes(stored) ? stored : 'ice')
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
