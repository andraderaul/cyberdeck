name: CI

on:
  push:
    branches: [main]
  pull_request:
    # `feat/**` so a stack of PRs merging into a long-lived feature branch is gated the same way
    # as one merging into main — without it the sub-PRs of a stack land entirely unchecked.
    branches: [main, 'feat/**']
    # No job reads anything a docs change can affect, so the run is pure cost.
    # `**.md` already covers docs/**/*.md; `docs/**` is here for non-markdown assets in that tree.
    #
    # Safe only while `main` has NO required status checks: a filtered-out workflow never reports,
    # and the PR blocks forever on "Expected — waiting for status to be reported". If required
    # checks are enabled later, swap this for the skip-job pattern (a job matching these paths
    # that reports success) rather than deleting the filter.
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".changeset/**"
      - "LICENSE"

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run test:run

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build

  # Separate from Build on purpose, and for the same reason e2e is separate from Test: a build that
  # breaks and a build that merely got fatter are unrelated failures, and one check name could not
  # say which. Its own job also means the size report is a log a reviewer can open directly.
  bundle:
    name: Bundle budget
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build

      # The delta is what makes the report useful in review — "this PR costs 4 kB" rather than "the
      # bundle is 76 kB". It needs the base branch built too, so the base is checked out beside the
      # head build and measured into a JSON the check below reads.
      #
      # `continue-on-error` because the delta is informational and the ceiling is not: a base that
      # fails to build (or a first PR from a branch point that predates this script) must degrade to
      # a report without a delta, never to a green check that measured nothing.
      #
      # `.bundle-base` sits inside the workspace because `actions/checkout` cannot place a checkout
      # outside it. It is not a workspace of the root package — the globs are `apps/*` and
      # `packages/*` — so the root `npm ci` above never sees it.
      - name: Check out the base branch
        if: ${{ github.event_name == 'pull_request' }}
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: .bundle-base

      - name: Measure the base branch
        if: ${{ github.event_name == 'pull_request' }}
        continue-on-error: true
        working-directory: .bundle-base
        run: |
          npm ci
          npm run build
          node "$GITHUB_WORKSPACE/scripts/bundle-budget.mjs" --root . --emit "$RUNNER_TEMP/base-bundle.json"

      - name: Check the ceilings
        run: node scripts/bundle-budget.mjs --baseline "$RUNNER_TEMP/base-bundle.json"

  # Separate from Test on purpose: these two suites fail for unrelated reasons — a unit regression
  # against a component, or a built artifact that renders wrong while every unit test still passes
  # — and a single job would make the check name say nothing about which. The harness builds every
  # workspace and serves each `dist` itself, one Playwright project per workspace, so a failure
  # arrives already labelled with which program broke (see `playwright.config.ts`).
  #
  # Self-contained by design — no `needs:`, no steps shared with another job. It runs beside Test,
  # Build and Bundle budget rather than after them, which is what lets an unrelated PR add a job
  # here without touching this one.
  e2e:
    name: Smoke E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci

      # The specs' own typecheck, ahead of the browser. `npm run typecheck` fans out over
      # workspaces and the root is not one, so this is the root project (`tsconfig.json`) alone —
      # the same one that script now ends with. It costs a couple of seconds and it costs them
      # first: a spec that no longer compiles against an app it imports should not be found five
      # builds and a browser later.
      - name: Typecheck the specs
        run: npx tsc

      - run: npx playwright install --with-deps chromium
      # Everything except the `@a11y` tag, which the job below owns. Two checks rather than one for
      # the same reason this job is not part of Test: a program that boots wrong and a control that
      # is 7px too small are unrelated failures, and one check name could not say which.
      - run: npm run test:e2e:smoke
      - uses: actions/upload-artifact@v4
        if: ${{ failure() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # Holds the accessibility work of #288 and #297, which nothing else does: every control at 44x44
  # counting the ones that buy it as an overlay, every canvas overlay on the opaque ground ADR 0013
  # requires, and axe over each program's surfaces at WCAG A and AA (#329). Every finding names the
  # element, the rule and the program, so the log reads without a browser.
  #
  # Self-contained by design, and for the same reason `Smoke E2E` above is — no `needs:`, no steps
  # shared with another job. It pays for its own five builds and five preview servers, which is the
  # cost of measuring the thing that ships rather than the thing the unit suite mounts.
  #
  # Its own job rather than more assertions inside `Smoke E2E`, because "the program is broken" and
  # "the program is unusable by half its users" are different reports, and a reviewer should be able
  # to tell them apart from the check name.
  a11y:
    name: Accessibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci

      # The specs' own typecheck, ahead of the browser — the same step `Smoke E2E` opens with, and
      # duplicated rather than shared on purpose (this job takes nothing from that one). It costs a
      # couple of seconds and it costs them first: a spec that no longer compiles against an app it
      # imports should not be found five builds and a browser later.
      - name: Typecheck the specs
        run: npx tsc

      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e:a11y
      - uses: actions/upload-artifact@v4
        if: ${{ failure() }}
        with:
          name: playwright-report-a11y
          path: playwright-report/
          retention-days: 7
