name: CI

on:
  push:
    branches: [main]
  pull_request:
    # `feat/**` so a stack of PRs merging into a long-lived feature branch is gated the same way
    # as one merging into main — without it the sub-PRs of a stack land entirely unchecked.
    branches: [main, 'feat/**']
    # No job reads anything a docs change can affect, so the run is pure cost.
    # `**.md` already covers docs/**/*.md; `docs/**` is here for non-markdown assets in that tree.
    #
    # Safe only while `main` has NO required status checks: a filtered-out workflow never reports,
    # and the PR blocks forever on "Expected — waiting for status to be reported". If required
    # checks are enabled later, swap this for the skip-job pattern (a job matching these paths
    # that reports success) rather than deleting the filter.
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".changeset/**"
      - "LICENSE"

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run test:run

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build

  # Separate from Build on purpose, and for the same reason e2e is separate from Test: a build that
  # breaks and a build that merely got fatter are unrelated failures, and one check name could not
  # say which. Its own job also means the size report is a log a reviewer can open directly.
  bundle:
    name: Bundle budget
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build

      # The delta is what makes the report useful in review — "this PR costs 4 kB" rather than "the
      # bundle is 76 kB". It needs the base branch built too, so the base is checked out beside the
      # head build and measured into a JSON the check below reads.
      #
      # `continue-on-error` because the delta is informational and the ceiling is not: a base that
      # fails to build (or a first PR from a branch point that predates this script) must degrade to
      # a report without a delta, never to a green check that measured nothing.
      #
      # `.bundle-base` sits inside the workspace because `actions/checkout` cannot place a checkout
      # outside it. It is not a workspace of the root package — the globs are `apps/*` and
      # `packages/*` — so the root `npm ci` above never sees it.
      - name: Check out the base branch
        if: ${{ github.event_name == 'pull_request' }}
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: .bundle-base

      - name: Measure the base branch
        if: ${{ github.event_name == 'pull_request' }}
        continue-on-error: true
        working-directory: .bundle-base
        run: |
          npm ci
          npm run build
          node "$GITHUB_WORKSPACE/scripts/bundle-budget.mjs" --root . --emit "$RUNNER_TEMP/base-bundle.json"

      - name: Check the ceilings
        run: node scripts/bundle-budget.mjs --baseline "$RUNNER_TEMP/base-bundle.json"

  # Separate from Test on purpose: these two suites fail for unrelated reasons — a unit regression
  # against a component, or a built artifact that renders wrong while every unit test still passes
  # — and a single job would make the check name say nothing about which. The harness builds every
  # workspace and serves each `dist` itself, one Playwright project per workspace, so a failure
  # arrives already labelled with which program broke (see `playwright.config.ts`).
  #
  # Self-contained by design — no `needs:`, no steps shared with another job. It runs beside Test,
  # Build and Bundle budget rather than after them, which is what lets an unrelated PR add a job
  # here without touching this one.
  e2e:
    name: Smoke E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci

      # The specs' own typecheck, ahead of the browser. `npm run typecheck` fans out over
      # workspaces and the root is not one, so this is the root project (`tsconfig.json`) alone —
      # the same one that script now ends with. It costs a couple of seconds and it costs them
      # first: a spec that no longer compiles against an app it imports should not be found five
      # builds and a browser later.
      - name: Typecheck the specs
        run: npx tsc

      - run: npx playwright install --with-deps chromium
      # Everything except the `@a11y` tag, which the job below owns. Two checks rather than one for
      # the same reason this job is not part of Test: a program that boots wrong and a control that
      # is 7px too small are unrelated failures, and one check name could not say which.
      - run: npm run test:e2e:smoke
      - uses: actions/upload-artifact@v4
        if: ${{ failure() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # Holds the accessibility work of #288 and #297, which nothing else does: every control at 44x44
  # counting the ones that buy it as an overlay, every canvas overlay on the opaque ground ADR 0013
  # requires, and axe over each program's surfaces at WCAG A and AA (#329). Every finding names the
  # element, the rule and the program, so the log reads without a browser.
  #
  # Self-contained by design, and for the same reason `Smoke E2E` above is — no `needs:`, no steps
  # shared with another job. It pays for its own five builds and five preview servers, which is the
  # cost of measuring the thing that ships rather than the thing the unit suite mounts.
  #
  # Its own job rather than more assertions inside `Smoke E2E`, because "the program is broken" and
  # "the program is unusable by half its users" are different reports, and a reviewer should be able
  # to tell them apart from the check name.
  a11y:
    name: Accessibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci

      # The specs' own typecheck, ahead of the browser — the same step `Smoke E2E` opens with, and
      # duplicated rather than shared on purpose (this job takes nothing from that one). It costs a
      # couple of seconds and it costs them first: a spec that no longer compiles against an app it
      # imports should not be found five builds and a browser later.
      - name: Typecheck the specs
        run: npx tsc

      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e:a11y
      - uses: actions/upload-artifact@v4
        if: ${{ failure() }}
        with:
          name: playwright-report-a11y
          path: playwright-report/
          retention-days: 7

  # The break that renders fine and looks wrong (#328): a spacing step the preset never defined and
  # so generates no class, a Theme token that resolves to nothing, an overlay that has lost the
  # opaque ground ADR 0013 requires it to carry. Nothing else on the deck can see any of those —
  # `Test` passes, `Smoke E2E` boots the program, `Accessibility` measures boxes and ratios, and the
  # pixels are wrong in all three.
  #
  # ITS OWN JOB, for three reasons and not only the one the other two share.
  #
  # The shared one first: a check name should say what kind of break it was, and "the program is
  # broken", "the program is unusable by half its users" and "the program looks wrong" are three
  # reports, not one.
  #
  # The second is the environment, and it is why this job does not merely add a step to `Smoke E2E`.
  # The deck ships no webfont (ADR 0024), so every glyph in a baseline is the system monospace of
  # the machine that took it — these pictures are only comparable inside one pinned environment, and
  # that is what `container:` and the `runs-on` below are. The other two jobs install a browser onto
  # an `ubuntu-latest` runner and are right to; this one *is* the image, on an architecture of its
  # own, so it could not share their steps even if it wanted to. No
  # `npx playwright install` for the same reason: the browsers ship inside. If the image tag here
  # ever drifts from the `@playwright/test` the lockfile resolves, Playwright refuses to launch and
  # says which revision it wanted — which is a loud enough failure not to guard twice.
  #
  # The third is the flake. `Smoke E2E` fails on `ubuntu-latest` roughly two runs in three, a
  # `chrome-headless-shell` SIGSEGV at browser launch, a different test each time; it is a starved
  # runner rather than the deck, and `playwright.config.ts` pins `retries: 0` on purpose rather than
  # papering over it. Folding screenshots into that job would make every one of those crashes
  # indistinguishable from a real pixel diff, for the one check whose remedy is "open the picture
  # and look" — the worst possible signal to bury under a flake. Running in the image with
  # `--ipc=host`, which is Playwright's own recommendation for exactly this crash class, is also the
  # best shot this suite has at not inheriting it. That is a hope and not a measurement, and it is
  # written down as one.
  #
  # Baselines are never written here. `updateSnapshots: 'none'` in the config means a missing or
  # changed picture fails and writes nothing; retaking one is `npm run screens:update` on a
  # developer's machine, and it arrives as a diff of committed `.png`s.
  screens:
    name: Visual regression
    # The one job on the deck that is not `ubuntu-latest`, and the architecture is load-bearing
    # rather than incidental. Chromium cannot run under qemu-user, so an amd64 image on an Apple
    # Silicon machine aborts at browser launch (`qemu: Assertion failed: p_rcu_reader->depth != 0`)
    # — pinning this suite to amd64 would mean baselines nobody can take or look at outside CI, for
    # a guard whose whole remedy is "open the picture and look". arm64 is native on the machines
    # this deck is developed on and free on public repositories, so `scripts/screens.sh` and this
    # job are the same image on the same architecture, both native. The suite fails rather than
    # skips if this runner is ever anything else.
    runs-on: ubuntu-24.04-arm
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
      # Chromium's default 64MB `/dev/shm` inside a container is not enough for it, and the crash
      # when it runs out looks like a browser bug rather than a memory one.
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4
      # No `setup-node` and no `cache: npm`, unlike the jobs above, and both absences are the same
      # point: the environment is the image, all of it. A Node installed over the top would be one
      # more thing that can differ between this job and the developer running
      # `scripts/screens.sh`, which is the one difference this suite cannot tolerate. The image's
      # Node satisfies `.nvmrc`'s floor, and the install is the lockfile's either way.
      - run: npm ci

      # The specs' own typecheck, ahead of the browser — the same step the two jobs above open with,
      # and duplicated rather than shared for the same reason (this job takes nothing from them).
      - name: Typecheck the specs
        run: npx tsc

      - run: npm run test:e2e:screens
      # The report is the whole point of the artifact here: for a pixel diff it carries the expected
      # picture, the actual one and the diff between them side by side, which no log line can.
      - uses: actions/upload-artifact@v4
        if: ${{ failure() }}
        with:
          name: playwright-report-screens
          path: playwright-report/
          retention-days: 7
